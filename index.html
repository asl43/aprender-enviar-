<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário Avançado Google Sheets</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      margin-bottom: 30px;
    }
    h1 {
      text-align: center;
      color: #1976d2;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #1565c0;
    }
    #msg {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #1976d2;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #1976d2;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Enviar Dados</h1>
    <form id="dataForm">
      <label>Nome:</label>
      <input type="text" name="nome" required>

      <label>Email:</label>
      <input type="email" name="email" required>

      <label>Telefone:</label>
      <input type="text" name="telefone">

      <label>Cargo:</label>
      <input type="text" name="cargo">

      <label>Setor:</label>
      <input type="text" name="setor">

      <label>Mensagem:</label>
      <textarea name="mensagem" rows="4" required></textarea>

      <button type="submit">Enviar</button>
    </form>
    <p id="msg"></p>
  </div>

  <div class="container">
    <h1>Dados Enviados</h1>
    <table id="dataTable">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>Telefone</th>
          <th>Cargo</th>
          <th>Setor</th>
          <th>Mensagem</th>
          <th>Data/Hora</th>
        </tr>
      </thead>
      <tbody>
        <!-- Dados enviados serão adicionados aqui -->
      </tbody>
    </table>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbxSUsVkeLNbL787ZetPgIYDpAOD-HuwWY7_tnUXFjV2c4FL89y2tFENC6aXzUYlyToAdw/exec";
    const form = document.getElementById('dataForm');
    const msg = document.getElementById('msg');
    const tableBody = document.querySelector('#dataTable tbody');

    form.addEventListener('submit', e => {
      e.preventDefault();
      msg.textContent = "⏳ Enviando...";

      fetch(scriptURL, { method: 'POST', body: new FormData(form) })
        .then(response => response.text())
        .then(result => {
          msg.textContent = "✅ Dados enviados com sucesso!";
          addRowToTable(form);
          form.reset();
        })
        .catch(error => {
          msg.textContent = "❌ Erro ao enviar!";
          console.error('Erro!', error);
        });
    });

    function addRowToTable(form) {
      const row = document.createElement('tr');
      const dateTime = new Date().toLocaleString();
      const fields = ['nome','email','telefone','cargo','setor','mensagem'];

      fields.forEach(field => {
        const cell = document.createElement('td');
        cell.textContent = form[field].value || '';
        row.appendChild(cell);
      });

      const dateCell = document.createElement('td');
      dateCell.textContent = dateTime;
      row.appendChild(dateCell);

      tableBody.appendChild(row);
    }
  </script>

</body>
</html>
